[package]
name = "gentle-eye"
version = "0.1.0"
edition = "2021"
description = "MCP server for screen recording and AI video analysis"

[dependencies]
# MCP Server. `transport-io` adds the stdio transport (JSON-RPC over stdio) the
# binary serves on — required for an MCP server; the recovered spec's
# ["server","macros"] list omitted it.
rmcp = { version = "0.1", features = ["server", "macros", "transport-io"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Screen Capture
scrap = "0.5"

# Region engine — X11 window enumeration (EWMH). Pure-Rust, no system libs.
# `screensaver` (MIT-SCREEN-SAVER) backs dayflow's idle detection: it exposes the
# X server's idle-millisecond counter, verified monotonic on this host (T005).
# A FEATURE on an already-pinned crate, deliberately — not a new dependency.
# NB the extension's `state` field is NOT a usable lock signal under GNOME
# (reports 3, outside the documented 0/1/2 range); only the idle counter is used.
x11rb = { version = "0.13", features = ["screensaver"] }

# Computer vision for "target" measurement mode (Phase 2): pure-Rust Canny /
# projection profiles / color masks. No system libraries (opencv stays deferred
# behind the optional `tracking` feature). Pinned per the dep discipline.
image = "0.25"
imageproc = "0.25"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Cross-platform system memory stats (Linux/macOS/Windows) for the
# capture-pipeline memory-pressure monitor. Replaces the Linux-only
# /proc/meminfo reader so the monitor works on every host.
sysinfo = "0.39"

# Vision Providers
reqwest = { version = "0.12", features = ["json"] }
schemars = { version = "0.8", features = ["chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"
config = "0.14"
directories = "5"

# Error Handling
thiserror = "1"
anyhow = "1"

# Utilities
base64 = "0.22"
mime_guess = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Region tracking + screen-recovery CV. OPTIONAL + behind the `tracking`
# feature so the default build needs NO system libraries (opencv requires
# libopencv-dev + C++ linkage). See `docs/TARGET.md` and PRD §3.
#
# 0.100 (was 0.94) for the OpenCV 5.x line. opencv-rust supports 4.x OR 5.x;
# 5.x is what the screen-recovery work needs, because the useful modules for
# recovering text off a filmed screen live in CONTRIB, not core:
#   ximgproc      guided/edge-preserving filter (keeps glyph edges through a stack)
#   dnn_superres  learned upscaling -- AVAILABLE but deliberately NOT a default:
#                 it INVENTS detail and on text yields confident wrong glyphs.
#   quality       measurable before/after, so an "enhancement" must prove itself
# Core pieces used by the stacker: findTransformECC, phaseCorrelate,
# warpPerspective/warpAffine, getPerspectiveTransform.
opencv = { version = "0.100", optional = true }

# Opt-in "richwindow" preview backend ONLY (optional; behind the feature). A
# pure-Rust window for the live preview — NOT built by default (75-crate tree
# kept out of the default trust surface). See docs/PREVIEW.md.
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

# Native visual annotator GUI ("redpen") only — optional + behind the `ui`
# feature so the default MCP-server/CLI build never pulls the egui/wgpu stack.
eframe = { version = "0.29", optional = true }
atspi = { version = "0.30.0", features = ["tokio"] }

[features]
# Opt-in real-time region tracking (Phase 3). Off by default — enable with
# `--features tracking`, which requires `libopencv-dev` to be installed.
tracking = ["dep:opencv"]
# Opt-in pure-Rust preview window for the live preview. Off by default — enable
# with `--features richwindow` (pulls winit+softbuffer, ~75 crates).
richwindow = ["dep:winit", "dep:softbuffer"]
# Native "redpen" visual annotator binary. Off by default — build with
# `cargo build --features ui --bin redpen` (pulls eframe/egui).
ui = ["dep:eframe"]

[dev-dependencies]
mockall = "0.12"
tempfile = "3"

[[bin]]
name = "gentle-eye"
path = "src/bin/gentle-eye.rs"

# The native annotator GUI — only built with `--features ui` (keeps egui out of
# the default `gentle-eye` build).
[[bin]]
name = "redpen"
path = "src/bin/redpen.rs"
required-features = ["ui"]
