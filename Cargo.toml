[package]
name = "gentle-eye"
version = "0.1.0"
edition = "2021"
description = "MCP server for screen recording and AI video analysis"

[dependencies]
# MCP Server. `transport-io` adds the stdio transport (JSON-RPC over stdio) the
# binary serves on — required for an MCP server; the recovered spec's
# ["server","macros"] list omitted it.
rmcp = { version = "0.1", features = ["server", "macros", "transport-io"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Screen Capture
scrap = "0.5"

# Computer vision for "target" measurement mode (Phase 2): pure-Rust Canny /
# projection profiles / color masks. No system libraries (opencv stays deferred
# behind the optional `tracking` feature). Pinned per the dep discipline.
image = "0.25"
imageproc = "0.25"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Vision Providers
reqwest = { version = "0.12", features = ["json"] }
schemars = { version = "0.8", features = ["chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"
config = "0.14"
directories = "5"

# Error Handling
thiserror = "1"
anyhow = "1"

# Utilities
base64 = "0.22"
mime_guess = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 3 (DEFERRED) region tracking only. OPTIONAL + behind the `tracking`
# feature so the default build needs NO system libraries (opencv requires
# libopencv-dev + C++ linkage). See `docs/TARGET.md` and PRD §3.
opencv = { version = "0.94", optional = true }

[features]
# Opt-in real-time region tracking (Phase 3). Off by default — enable with
# `--features tracking`, which requires `libopencv-dev` to be installed.
tracking = ["dep:opencv"]

[dev-dependencies]
mockall = "0.12"
tempfile = "3"

[[bin]]
name = "gentle-eye"
path = "src/bin/gentle-eye.rs"
