# gentle-eye — dev-kid project config (Wave 2+ rebuild · dogfood mode)
#
# Used by /devkid.preflight / /devkid.orchestrate / /devkid.execute.
# Tier/provider config inherited from ~/.dev-kid/ralph-tiers.json (Mac ollama LAN).

project_name: gentle-eye
branch: 001-mcp-screen-tools

# Small waves so the sentinel + you + atelier can scrutinise each checkpoint.
wave_size: 6

sentinel:
  enabled: true
  # Rust compile check is the sentinel's smoke test at each wave boundary.
  test_command: "./.tooling/bin/cargo check --message-format=short"
  # PROJECT-LOCAL tier ordering (claude-code-handoff moved from tier 5 → tier 10 per
  # user preference 2026-05-26: handoff is the senior in-house escalation, not early).
  # Absolute path because dev-kid doesn't expand `~` in YAML.
  tiers_file: /home/gyasis/Documents/code/gentle-eye/ralph-tiers.json
  # CRITICAL: the runtime reads sentinel.tier1.ollama_url (config_manager.py:185
  # → tier1.get("ollama_url")). A top-level sentinel.ollama_url is IGNORED and
  # the runtime silently falls back to localhost:11434, skipping every local
  # tier (bug found 2026-05-26: 45-min run wasted escalating to paid tiers).
  # Localhost ollama is DOWN; Mac LAN is UP and hosts qwen3-coder:30b/gemma3:27b/deepseek-r1:32b.
  tier1:
    ollama_url: http://192.168.0.159:11434
  # Start at all-local; escalate only if local can't fix.
  min_tier: ""

# Halt-and-fix is THE protocol per session decision 2026-05-26 (Q3):
# any dev-kid / sentinel / micro-agent / atelier bug = the valued finding.
# Stop, capture, fix the TOOL, then resume the build.
halt_on_tool_bug: true
